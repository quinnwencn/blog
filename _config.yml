title: Quinn's Blog
subtitle: AI infrastructure, systems engineering, and technical notes
description: Quinn's technical blog covering AI infrastructure, C++, systems, security, Linux, and embedded development.
keywords:
author: Quinn
language: zh-CN
timezone: Europe/Madrid

url: https://quinnwencn.github.io/blog
root: /blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: posts
  per_page: 10
  order_by: -date

default_category: legacy
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: fluid

deploy:
  type:

markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: false
    typographer: false
  plugins:
    - markdown-it-mathjax3
  anchors:
    level: 1
    permalink: false
    case: 0
    separator: "-"
  images:
    prepend_root: true
    post_asset: true
